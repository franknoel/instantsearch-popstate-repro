<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>inPopState repro</title>
    <script src="https://cdn.jsdelivr.net/npm/algoliasearch@5.59.0/dist/lite/builds/browser.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/instantsearch.js@4.118.1/dist/instantsearch.production.min.js"></script>
  </head>
  <body>
    <p><a id="anchor" href="#details">Go to #details</a>, then press Back.</p>
    <div id="searchbox"></div>
    <div id="hits"></div>
    <div id="pagination"></div>
    <p id="details">Details</p>
    <script>
      const search = instantsearch({
        indexName: "instant_search",
        searchClient: window["algoliasearch/lite"].liteClient(
          "latency",
          "6be0576ff61c053d5f9a3225e2a90f76",
        ),
        routing: true,
      });
      search.addWidgets([
        instantsearch.widgets.searchBox({ container: "#searchbox" }),
        instantsearch.widgets.hits({
          container: "#hits",
          templates: { item: (hit) => hit.name },
        }),
        instantsearch.widgets.pagination({ container: "#pagination" }),
      ]);
      search.start();
    </script>
  </body>
</html>
